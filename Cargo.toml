[package]
name = "shitty-hdl"
version.workspace = true
edition.workspace = true

[workspace]
resolver = "3"
members = [".", "board/", "front/", "cli/", "derive/", "platform/"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
front = { package = "shitty-hdl-front", path = "front/" }
board = { package = "shitty-hdl-board", path = "board/" }
cli = { package = "shitty-hdl-cli", path = "cli/" }
derive = { package = "shitty-hdl-derive", path = "derive/" }
platform = { package = "shitty-hdl-platform", path = "platform/" }

anyhow = { version = "1.0.104" }
bon = { version = "3.10.3" }
bumpalo = { version = "3.20.3" }
clap = { version = "4.6.7" }
const-default = { version = "1.0.0" }
darling = { version = "0.24.1" }
derive_more = { version = "2.1.1" }
generic-array = { version = "1.4.5" }
lasso = { version = "0.7.3" }
proc-macro2 = { version = "1.0.107" }
quote = { version = "1.0.47" }
smallvec = { version = "2.0.0-beta.4" }
syn = { version = "3.0.9" }
tracing = { version = "0.1.44" }
typenum = { version = "1.20.1" }
variadics_please = { version = "2.0.0" }

[workspace.lints.clippy]
absolute_paths = "warn"
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
option_if_let_else = "allow"
too_many_lines = "allow"
similar_names = "allow"
missing_panics_doc = "allow"

[dependencies]
board = { workspace = true }
# cli = { workspace = true }
front = { workspace = true }
# platform = { workspace = true }
